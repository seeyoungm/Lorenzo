[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorenzo-forge"
version = "0.1.0"
description = "Data profile -> neural architecture recommender, driven by a trained meta-model (lightweight NAS)."
requires-python = ">=3.10"
dependencies = [
    # Apple Silicon (arm64) uses the standard `tensorflow` wheel; x86 boxes use
    # the CPU-only build. On Apple Silicon add the `metal` extra for GPU.
    "tensorflow>=2.16; platform_machine == 'arm64'",
    "tensorflow-cpu>=2.16; platform_machine != 'arm64'",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.scripts]
lorenzo-forge = "lorenzo_forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Apple GPU acceleration on M-series Macs: `pip install -e ".[metal]"`
metal = ["tensorflow-metal>=1.1"]

[tool.setuptools.packages.find]
include = ["lorenzo_forge*"]
